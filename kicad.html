<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KiCad Voice Coworker (prototype)</title>
<style>
  :root {
    --bg: #0F1115;
    --panel: #171A21;
    --line: #262B36;
    --ink: #E6E9EF;
    --text-dim: #8B93A3;
    --accent: #3DDC97;
    --accent-dim: #1F5C43;
    --user-bubble: #202531;
    --assistant-bubble: #12261E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 22px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  header h1 span { color: var(--accent); }
  #status {
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #status .dot { width: 7px; height: 7px; border-radius: 50%; background: #E5484D; }
  #status .dot.ok { background: var(--accent); }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 3px; }
  .msg.assistant .bubble { background: var(--assistant-bubble); border-bottom-left-radius: 3px; }
  .msg.action .bubble {
    background: transparent;
    border: 1px dashed var(--accent-dim);
    color: var(--accent);
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 12.5px;
  }

  footer {
    border-top: 1px solid var(--line);
    padding: 14px 20px 20px;
    display: flex;
    justify-content: center;
  }
  .composer {
    max-width: 720px;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 6px 6px 16px;
  }
  #text-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--ink);
    font-size: 14px;
  }
  button.round {
    width: 38px; height: 38px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #mic-btn { background: #232838; color: var(--ink); }
  #mic-btn.listening { background: var(--accent); color: #08110D; }
  #send-btn { background: var(--accent); color: #08110D; }
  #send-btn:disabled { opacity: 0.4; cursor: default; }
  .hint { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 8px; }
</style>
</head>
<body>

<header>
  <h1>KiCad <span>Voice Coworker</span> — prototype</h1>
  <div id="status"><span class="dot" id="status-dot"></span><span id="status-text">checking bridge…</span></div>
</header>

<div id="log"></div>

<footer>
  <div style="max-width:720px; width:100%;">
    <div class="composer">
      <input id="text-input" type="text" placeholder="Type, or tap the mic and just talk…" />
      <button class="round" id="mic-btn" onclick="toggleMic()" title="Voice">🎤</button>
      <button class="round" id="send-btn" onclick="sendMessage()" title="Send">➤</button>
    </div>
    <div class="hint">Try: "build a voltage divider from 12 volts to 3.3 volts". KiCad isn't wired up yet — actions are simulated.</div>
  </div>
</footer>

<script>
  // ---------- Config ----------
  // Same-site relative paths now — the chat and action endpoints are
  // serverless functions living in /api on this same website, not a local
  // program on your PC. Nothing to run or start manually anymore.
  const BRIDGE_URL = "";

  // ---------- State ----------
  let history = [];       // [{role, content}] sent to Claude
  let busy = false;
  let voiceOn = false;
  let cachedVoice = null;

  const SYSTEM_PROMPT = `You are a spoken-language coworker who operates KiCad (electronics CAD) for the user.
You do NOT ask the user to specify every step (like "place R1, then place R2"). Instead, when asked to build a
known circuit, you confirm what you understood in one short, natural sentence, as if you're about to go do it.

Known circuit templates you can build right now: voltage_divider, rc_lowpass, rc_highpass.
If the user asks for something outside these, say so plainly and briefly - don't pretend to build it.

Keep replies SHORT (1-3 sentences) and conversational - they will be read aloud. No markdown, no bullet lists.
Ask at most one clarifying question at a time, only when a value genuinely can't be assumed.`;

  const EXTRACTION_PROMPT = `You will be given a conversation transcript between a user and a KiCad voice
assistant. Decide whether the assistant's most recent turn represents a decision to actually build a circuit
right now (not just discussion). Respond with ONLY strict JSON, nothing else, no markdown fences.

If a build should happen now:
{"action": "build_circuit", "template": "voltage_divider" | "rc_lowpass" | "rc_highpass", "params": {"vin": number|null, "vout": number|null, "cutoff_hz": number|null}}

If no build should happen yet (still clarifying, off-topic, or unsupported template):
{"action": "none"}`;

  // ---------- UI helpers ----------
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function appendMessage(role, text) {
    const log = document.getElementById('log');
    const msg = el('div', 'msg ' + role);
    const bubble = el('div', 'bubble', text);
    msg.appendChild(bubble);
    log.appendChild(msg);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  function setBusy(b) {
    busy = b;
    document.getElementById('send-btn').disabled = b;
  }

  // ---------- Bridge health check ----------
  async function checkHealth() {
    const dot = document.getElementById('status-dot');
    const text = document.getElementById('status-text');
    try {
      const res = await fetch(BRIDGE_URL + '/api/kicad-health');
      const data = await res.json();
      if (data.key_configured) {
        dot.classList.add('ok');
        text.textContent = 'connected · ' + data.model;
      } else {
        text.textContent = 'reachable, but no API key set (see Vercel/Netlify env vars)';
      }
    } catch (e) {
      text.textContent = 'assistant not reachable — check deployment';
    }
  }

  // ---------- Claude calls (via local bridge, never direct) ----------
  async function callClaude(messages, system, maxTokens) {
    const res = await fetch(BRIDGE_URL + '/api/kicad-chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages, system, max_tokens: maxTokens || 400 })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if (!textBlock) throw new Error('No response from assistant');
    return textBlock.text;
  }

  function tryParseJSON(raw) {
    try {
      return JSON.parse(raw.trim().replace(/^```json/, '').replace(/```$/, '').trim());
    } catch (e) {
      return null;
    }
  }

  // ---------- Executing an action against the bridge (stub today, real KiCad later) ----------
  async function executeAction(action) {
    const res = await fetch(BRIDGE_URL + '/api/kicad-action', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(action)
    });
    return res.json();
  }

  // ---------- Main send path (typed and spoken both funnel through here) ----------
  async function sendMessage(overrideText, viaVoice) {
    if (busy) return;
    const input = document.getElementById('text-input');
    const text = (overrideText !== undefined ? overrideText : input.value).trim();
    if (!text) return;

    appendMessage('user', text);
    input.value = '';
    history.push({ role: 'user', content: text });
    setBusy(true);

    try {
      const reply = await callClaude(history, SYSTEM_PROMPT);
      history.push({ role: 'assistant', content: reply });
      appendMessage('assistant', reply);

      // Second, deterministic pass: does this turn actually trigger a build?
      const transcript = history.map(m => (m.role === 'user' ? 'USER: ' : 'ASSISTANT: ') + m.content).join('\n');
      const extractionRaw = await callClaude(
        [{ role: 'user', content: transcript }],
        EXTRACTION_PROMPT,
        200
      );
      const parsed = tryParseJSON(extractionRaw);

      let spokenReply = reply;

      if (parsed && parsed.action === 'build_circuit') {
        appendMessage('action', JSON.stringify(parsed));
        const result = await executeAction(parsed);
        appendMessage('assistant', result.message);
        spokenReply = reply + ' ' + result.message;
      }

      if (voiceOn) {
        speak(spokenReply, () => { if (viaVoice) listenOnce(); });
      }
    } catch (e) {
      appendMessage('assistant', "Couldn't reach the assistant — " + e.message);
    } finally {
      setBusy(false);
    }
  }

  document.getElementById('text-input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  // ---------- Voice out ----------
  function pickVoice() {
    if (!window.speechSynthesis) return null;
    const voices = window.speechSynthesis.getVoices();
    return voices.find(v => /en-US/i.test(v.lang) && /Google|Natural|Samantha/i.test(v.name)) || voices.find(v => /en/i.test(v.lang)) || voices[0] || null;
  }
  if (window.speechSynthesis) {
    window.speechSynthesis.onvoiceschanged = () => { cachedVoice = pickVoice(); };
  }

  function speak(text, onDone) {
    if (!window.speechSynthesis) { if (onDone) onDone(); return; }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    if (!cachedVoice) cachedVoice = pickVoice();
    if (cachedVoice) utter.voice = cachedVoice;
    utter.rate = 1.02;
    utter.onend = () => { if (onDone) onDone(); };
    utter.onerror = () => { if (onDone) onDone(); };
    window.speechSynthesis.speak(utter);
  }

  // ---------- Voice in ----------
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  function listenOnce() {
    if (!SpeechRecognition || !voiceOn) return;
    const micBtn = document.getElementById('mic-btn');
    const recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    micBtn.classList.add('listening');
    recognition.start();
    recognition.onresult = (e) => sendMessage(e.results[0][0].transcript, true);
    recognition.onend = () => micBtn.classList.remove('listening');
    recognition.onerror = () => micBtn.classList.remove('listening');
  }

  function toggleMic() {
    if (!SpeechRecognition) { alert('Voice input needs Chrome or Edge.'); return; }
    voiceOn = !voiceOn;
    const micBtn = document.getElementById('mic-btn');
    if (voiceOn) {
      micBtn.style.background = 'var(--accent)';
      listenOnce();
    } else {
      micBtn.style.background = '';
      micBtn.classList.remove('listening');
      window.speechSynthesis && window.speechSynthesis.cancel();
    }
  }

  // ---------- Boot ----------
  checkHealth();
  appendMessage('assistant', "Hi — I'm your KiCad coworker. Tap the mic or type. I can build a voltage divider, an RC low-pass, or an RC high-pass filter (KiCad connection is simulated for now).");
</script>

</body>
</html>
